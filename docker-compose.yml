services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tennisbot
      POSTGRES_USER: tennisbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://tennisbot:${POSTGRES_PASSWORD}@db:5432/tennisbot
      BOOKING_WINDOW_DAYS: ${BOOKING_WINDOW_DAYS}
      MOCK_KNLTB: ${MOCK_KNLTB:-false}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - '80:3000'
volumes:
  db-data:
